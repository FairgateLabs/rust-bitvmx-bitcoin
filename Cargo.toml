[package]
name = "bitcoin-coordinator"
version = "0.8.2"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
bitcoincore-rpc = "0.19.0"
config = "0.15.25"
console = "0.16.4"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
ctrlc = "3.5.2"
hex = "0.4.3"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

rust-bitvmx-storage-backend = { git = "https://github.com/FairgateLabs/rust-bitvmx-storage-backend.git", tag = "v0.8.2" }
bitvmx-transaction-monitor = { git = "https://github.com/FairgateLabs/rust-bitvmx-transaction-monitor.git", tag = "v0.8.2" }
bitvmx-key-manager = { git = "https://github.com/FairgateLabs/rust-bitvmx-key-manager.git", tag = "v0.8.2" }
bitvmx-settings = { git = "https://github.com/FairgateLabs/rust-bitvmx-settings.git", tag = "v0.8.2" }
bitvmx-bitcoin-rpc = { git = "https://github.com/FairgateLabs/rust-bitvmx-bitcoin-rpc.git", tag = "v0.8.2" }
bitvmx-protocol-builder = { git = "https://github.com/FairgateLabs/rust-bitvmx-protocol-builder.git", tag = "v0.8.2" }


[dependencies.bitcoin]
version = "0.32.102"
features = ["rand-std", "serde"]

[dependencies.chrono]
version = "0.4.38"
features = ["serde"]

[dependencies.rand]
version = "0.10.2"
features = ["std", "std_rng"]

[dev-dependencies]
bitcoind = { git = "https://github.com/FairgateLabs/rust-bitcoind.git", tag = "v0.8.2" }
bitcoin-indexer = { git = "https://github.com/FairgateLabs/rust-bitcoin-indexer.git", tag = "v0.8.2" }
bitvmx-bitcoin-rpc = { git = "https://github.com/FairgateLabs/rust-bitvmx-bitcoin-rpc.git", tag = "v0.8.2", features = [
    "testing",
] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
